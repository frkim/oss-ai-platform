# Local developer edition of the open-source AI platform blueprint.
# Pillars covered: P02 gateway (LiteLLM), P03 serving (Ollama), P05 knowledge (Qdrant),
# P07 observability (Langfuse), P13 experience (Open WebUI).
name: oss-ai-platform

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-stable}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD}@postgres:5432/litellm
      OLLAMA_API_BASE: http://ollama:11434
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    volumes:
      - qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: local
      LANGFUSE_INIT_PROJECT_ID: platform
      LANGFUSE_INIT_PROJECT_NAME: platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-main}
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    depends_on:
      - litellm
      - qdrant
    restart: unless-stopped

volumes:
  ollama:
  postgres:
  qdrant:
  open-webui:
